name: Validate and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: year-end-radio-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run syntax checks and tests
        run: npm run check

      - name: Verify the production image builds
        run: docker build --tag year-end-radio:ci .

  deploy:
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - year-end-radio
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and start the production service
        run: docker compose --file compose.production.yml up --detach --build --remove-orphans

      - name: Verify yt-dlp and the local health endpoint
        run: |
          for attempt in {1..30}; do
            health="$(curl --fail --silent http://127.0.0.1:4173/api/health || true)"
            if [[ "$health" == *'"ytdlpAvailable":true'* ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --file compose.production.yml ps
          docker compose --file compose.production.yml logs --tail=100 app
          exit 1

      - name: Verify the private Tailscale endpoint
        run: curl --fail --show-error --silent https://grow-server.tail498d29.ts.net:8443/api/health
